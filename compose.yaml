name: rip-dvd

x-runtime-environment: &runtime-environment
  RIP_DVD_DATABASE_PATH: /data/rip-dvd.sqlite
  RIP_DVD_MEDIA_LIBRARY_PATH: /media/movies
  RIP_DVD_ORIGINALS_LIBRARY_PATH: /media/originals
  RIP_DVD_ARCHIVE_DEVICE_PATH: ${RIP_DVD_ARCHIVE_DEVICE_PATH:-/dev/sr0}
  RIP_DVD_WEB_TRUSTED_ORIGIN: ${RIP_DVD_WEB_TRUSTED_ORIGIN:-http://localhost:${RIP_DVD_WEB_PORT:-3000}}
  RIP_DVD_WORKER_POLL_INTERVAL_MS: ${RIP_DVD_WORKER_POLL_INTERVAL_MS:-5000}
  RIP_DVD_ARCHIVE_WORKER_CONCURRENCY: ${RIP_DVD_ARCHIVE_WORKER_CONCURRENCY:-2}
  RIP_DVD_ENCODE_WORKER_CONCURRENCY: ${RIP_DVD_ENCODE_WORKER_CONCURRENCY:-1}

services:
  validation:
    profiles: ["validation"]
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      target: validation
    command: ["true"]

  migrate:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      target: deployment-tools
    environment:
      RIP_DVD_DATABASE_PATH: /data/rip-dvd.sqlite
    command: ["node", "scripts/migrate-database.mjs"]
    volumes:
      - rip-dvd-data:/data

  backup:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      target: deployment-tools
    command: ["sh", "scripts/backup-sqlite.sh"]
    volumes:
      # SQLite WAL readers may create/update the shared-memory lock file. The
      # backup command itself never mutates application rows.
      - rip-dvd-data:/data
      - ${RIP_DVD_BACKUP_HOST_PATH:-./backups}:/backups

  web:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      target: web
    environment: *runtime-environment
    ports:
      - "${RIP_DVD_WEB_BIND_ADDRESS:-127.0.0.1}:${RIP_DVD_WEB_PORT:-3000}:3000"
    volumes:
      - rip-dvd-data:/data
      - ${RIP_DVD_MEDIA_LIBRARY_HOST_PATH:-rip-dvd-media}:/media/movies:ro
      - ${RIP_DVD_ORIGINALS_LIBRARY_HOST_PATH:-rip-dvd-originals}:/media/originals:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  archive-worker:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      target: archive-worker
    environment:
      <<: *runtime-environment
      RIP_DVD_WORKER_NICE_LEVEL: ${RIP_DVD_ARCHIVE_NICE_LEVEL:-10}
      RIP_DVD_WORKER_IONICE_CLASS: ${RIP_DVD_ARCHIVE_IONICE_CLASS:-2}
      RIP_DVD_WORKER_IONICE_LEVEL: ${RIP_DVD_ARCHIVE_IONICE_LEVEL:-7}
    cpu_shares: ${RIP_DVD_ARCHIVE_CPU_SHARES:-512}
    group_add:
      - "${RIP_DVD_OPTICAL_DEVICE_GID:-24}"
    devices:
      - "${RIP_DVD_ARCHIVE_DEVICE_PATH:-/dev/sr0}:${RIP_DVD_ARCHIVE_DEVICE_PATH:-/dev/sr0}:r"
      - "${RIP_DVD_ARCHIVE_CSS_DEVICE_PATH:-/dev/sg1}:${RIP_DVD_ARCHIVE_CSS_DEVICE_PATH:-/dev/sg1}:r"
    volumes:
      - rip-dvd-data:/data
      - ${RIP_DVD_ORIGINALS_LIBRARY_HOST_PATH:-rip-dvd-originals}:/media/originals
    restart: unless-stopped

  encode-worker:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      target: encode-worker
    environment:
      <<: *runtime-environment
      RIP_DVD_WORKER_NICE_LEVEL: ${RIP_DVD_ENCODE_NICE_LEVEL:-19}
      RIP_DVD_WORKER_IONICE_CLASS: ${RIP_DVD_ENCODE_IONICE_CLASS:-3}
      RIP_DVD_WORKER_IONICE_LEVEL: ${RIP_DVD_ENCODE_IONICE_LEVEL:-7}
    cpu_shares: ${RIP_DVD_ENCODE_CPU_SHARES:-128}
    volumes:
      - rip-dvd-data:/data
      - ${RIP_DVD_MEDIA_LIBRARY_HOST_PATH:-rip-dvd-media}:/media/movies
      - ${RIP_DVD_ORIGINALS_LIBRARY_HOST_PATH:-rip-dvd-originals}:/media/originals:ro
    restart: unless-stopped

volumes:
  rip-dvd-data:
  rip-dvd-media:
  rip-dvd-originals:
