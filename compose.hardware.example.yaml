# Example of the narrow override generated by scripts/optical-drive-mapping.mjs.
# Prefer configuring stable serials in .local/optical-drives.json; do not copy
# host-specific paths into version control. !override is required so stale base
# mappings are replaced instead of merged with the discovered device list.
services:
  archive-worker:
    environment:
      RIP_DVD_ARCHIVE_DEVICE_PATH: "/dev/sr1"
      RIP_DVD_ARCHIVE_CSS_DEVICE_PATH: "/dev/sg2"
    devices: !override
      - "/dev/sr1:/dev/sr1:r"
      - "/dev/sg2:/dev/sg2:r"
