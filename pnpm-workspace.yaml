packages:
  - apps/*
  - packages/*
overrides:
  # GHSA-6g55-p6wh-862q and GHSA-r28c-9q8g-f849 affect PostCSS releases before 8.5.18.
  postcss: 8.5.23
  # GHSA-f88m-g3jw-g9cj affects Sharp releases before 0.35.0.
  sharp: 0.35.0
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - next@16.2.11
  - react-dom@19.2.8
  - react@19.2.8
